<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBIT — Paramètres</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    .page-body { padding: 36px 0 80px; }

    .breadcrumb {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 12px;
      color: var(--text-dim); margin-bottom: 28px;
    }
    .breadcrumb a { color: var(--text-dim); }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--text-faint); }

    .settings-grid {
      display: flex; flex-direction: column; gap: 24px;
      max-width: 680px;
    }

    .settings-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .settings-section-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .settings-section-icon { font-size: 16px; }
    .settings-section-title {
      font-size: 13px; font-weight: 600;
      color: var(--text-bright);
      letter-spacing: 0.5px;
    }
    .settings-section-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .settings-row { grid-template-columns: 1fr; } }

    /* Entrypoint selector */
    .entry-select-wrap { position: relative; }
    .entry-select-wrap select.form-input {
      appearance: none;
      padding-right: 28px;
      cursor: pointer;
    }
    .entry-select-wrap::after {
      content: "▾";
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text-dim); pointer-events: none; font-size: 12px;
    }

    /* Toggle switch */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .toggle-row:last-child { border-bottom: none; padding-bottom: 0; }
    .toggle-label { display: flex; flex-direction: column; gap: 2px; }
    .toggle-label-title { font-size: 13px; color: var(--text-bright); }
    .toggle-label-sub { font-size: 11px; color: var(--text-dim); }
    .toggle {
      position: relative; width: 40px; height: 22px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border-lit);
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: ""; position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

    /* GitHub status */
    .github-status {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 12px; font-family: var(--font-mono);
    }
    .github-status.linked { background: #00ff8808; border: 1px solid #00ff8822; color: var(--green); }
    .github-status.unlinked { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-faint); }

    .token-input-wrap { position: relative; }
    .token-input-wrap input { padding-right: 80px; }
    .token-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-size: 11px; color: var(--text-dim);
      cursor: pointer; background: none; border: none;
      font-family: var(--font-mono);
    }
    .token-toggle:hover { color: var(--accent); }

    .pull-result {
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 12px; font-family: var(--font-mono);
      display: none;
    }
    .pull-result.success { background: #00ff8808; border: 1px solid #00ff8822; color: var(--green); }
    .pull-result.warn { background: #ffaa0008; border: 1px solid #ffaa0022; color: var(--yellow, #ffaa00); }
    .pull-result.error { background: #ff335508; border: 1px solid #ff335522; color: var(--red); }

    .commit-sha {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--text-faint);
      padding: 6px 0;
    }
    .commit-sha span { color: var(--accent); }

    .save-bar {
      position: sticky; bottom: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .save-status { font-size: 12px; font-family: var(--font-mono); }
    .save-status.saved { color: var(--green); }
    .save-status.error { color: var(--red); }
  </style>
</head>
<body>
  <div class="starfield"></div>

  <nav>
    <div class="nav-brand" onclick="Utils.go('../../')" style="cursor:pointer">
      <span class="brand-dot"></span>ORBIT
    </div>
    <ul class="nav-links">
      <li><a href="../../">Accueil</a></li>
      <li><a href="../../dashboard">Dashboard</a></li>
    </ul>
    <div class="nav-actions">
      <span style="color:var(--text-dim);font-size:12px;margin-right:8px" id="nav-username"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Déconnexion</button>
    </div>
  </nav>

  <div class="page">
    <div class="container page-body">

      <div class="breadcrumb">
        <a href="../../dashboard">Dashboard</a>
        <span class="sep">/</span>
        <a href="#" id="bc-script" onclick="goToScript()">Script</a>
        <span class="sep">/</span>
        <span style="color:var(--text-main)">Paramètres</span>
      </div>

      <div style="margin-bottom:28px">
        <h1 style="font-family:var(--font-display);font-size:20px;letter-spacing:2px;color:var(--text-bright);margin-bottom:4px" id="page-title">Paramètres</h1>
        <p style="font-size:12px;color:var(--text-dim);font-family:var(--font-mono)" id="page-sub">—</p>
      </div>

      <div class="settings-grid" id="settings-grid">
        <div class="loading-overlay"><span class="spinner"></span> Chargement...</div>
      </div>

    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    Utils.requireAuth();
    document.getElementById("nav-username").textContent = Utils.getUsername();

    const scriptId = new URLSearchParams(location.search).get("id");
    if (!scriptId) Utils.go("../../dashboard/");

    let currentSettings = null;
    let currentFiles = [];
    let dirty = false;

    function goToScript() { Utils.go(`../../script/?id=${scriptId}`); }
    document.getElementById("bc-script").onclick = goToScript;

    // ── Charger ────────────────────────────────────────────
    async function load() {
      try {
        const data = await API.getSettings(scriptId);
        currentSettings = data.settings;
        currentFiles = data.files || [];
        render();
      } catch (e) {
        Utils.toast(e.message, "error");
      }
    }

    // ── Rendu ──────────────────────────────────────────────
    function render() {
      const s = currentSettings;
      document.title = `ORBIT — ${s.name} — Paramètres`;
      document.getElementById("page-title").textContent = s.name;
      document.getElementById("page-sub").textContent = `${s.language} · ${s.id.slice(0,8)}…`;

      const grid = document.getElementById("settings-grid");
      grid.innerHTML = `

        <!-- Général -->
        <div class="settings-section">
          <div class="settings-section-header">
            <span class="settings-section-icon">⚙️</span>
            <span class="settings-section-title">Général</span>
          </div>
          <div class="settings-section-body">
            <div class="settings-row">
              <div class="form-group">
                <label class="form-label">Nom du script</label>
                <input class="form-input" id="s-name" type="text" value="${escHtml(s.name)}" />
              </div>
              <div class="form-group">
                <label class="form-label">Langage</label>
                <select class="form-input" id="s-lang">
                  ${["python","bash","nodejs"].map(l =>
                    `<option value="${l}" ${s.language===l?"selected":""}>${l}</option>`
                  ).join("")}
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <input class="form-input" id="s-desc" type="text" value="${escHtml(s.description)}" placeholder="Description optionnelle" />
            </div>
            <div class="form-group">
              <label class="form-label">Point d'entrée</label>
              <div class="entry-select-wrap">
                <select class="form-input" id="s-entry">
                  ${currentFiles.map(f =>
                    `<option value="${f.path}" ${s.entrypoint===f.path?"selected":""}>${f.path}</option>`
                  ).join("")}
                </select>
              </div>
              <div style="font-size:11px;color:var(--text-faint);margin-top:4px;font-family:var(--font-mono)">
                Fichier exécuté au lancement du container
              </div>
            </div>
          </div>
        </div>

        <!-- GitHub -->
        <div class="settings-section">
          <div class="settings-section-header">
            <span class="settings-section-icon">🐙</span>
            <span class="settings-section-title">GitHub</span>
          </div>
          <div class="settings-section-body">

            <div class="github-status ${s.github_url ? 'linked' : 'unlinked'}" id="github-status">
              ${s.github_url
                ? `✓ Lié à <strong>${s.github_url}</strong>`
                : `○ Aucun repository lié`}
            </div>

            <div class="form-group">
              <label class="form-label">URL du repository</label>
              <input class="form-input" id="s-github-url" type="text"
                value="${escHtml(s.github_url)}"
                placeholder="https://github.com/owner/repo" />
            </div>

            <div class="form-group">
              <label class="form-label">Token d'accès (PAT) <span style="color:var(--text-faint)">${s.github_token_set ? "· déjà défini" : "· optionnel pour repos publics"}</span></label>
              <div class="token-input-wrap">
                <input class="form-input" id="s-github-token" type="password"
                  placeholder="${s.github_token_set ? "••••••••••••••• (laisser vide pour ne pas changer)" : "ghp_xxxxx"}" />
                <button class="token-toggle" type="button" onclick="toggleTokenVisibility()">Afficher</button>
              </div>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn btn-primary btn-sm" onclick="doClone()">
                📥 Cloner le repo
              </button>
              <button class="btn btn-ghost btn-sm" onclick="doPull()" ${!s.github_url ? "disabled" : ""} id="btn-pull">
                ↓ Pull manuel
              </button>
            </div>

            <div class="pull-result" id="pull-result"></div>

            ${s.last_commit_sha ? `
              <div class="commit-sha">
                Dernier commit : <span>${s.last_commit_sha.slice(0,12)}</span>
                ${s.last_pulled_at ? `· ${Utils.formatDate(s.last_pulled_at)}` : ""}
              </div>
            ` : ""}

            <div style="border-top:1px solid var(--border);padding-top:16px">
              <div class="toggle-row">
                <div class="toggle-label">
                  <span class="toggle-label-title">Mise à jour automatique</span>
                  <span class="toggle-label-sub">Pull automatique chaque nuit à minuit (±15 min)</span>
                </div>
                <label class="toggle">
                  <input type="checkbox" id="s-auto-update" ${s.auto_update ? "checked" : ""} />
                  <span class="toggle-slider"></span>
                </label>
              </div>
              <div class="toggle-row">
                <div class="toggle-label">
                  <span class="toggle-label-title">Redémarrage automatique</span>
                  <span class="toggle-label-sub">Arrêter le script en cours, updater, puis relancer</span>
                </div>
                <label class="toggle">
                  <input type="checkbox" id="s-auto-restart" ${s.auto_restart ? "checked" : ""} />
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>

          </div>
        </div>

        <!-- Barre de sauvegarde -->
        <div class="save-bar">
          <span class="save-status" id="save-status"></span>
          <div style="display:flex;gap:10px">
            <button class="btn btn-ghost btn-sm" onclick="goToScript()">← Retour au script</button>
            <button class="btn btn-primary" onclick="saveSettings()">💾 Sauvegarder</button>
          </div>
        </div>
      `;

      // Marquer dirty sur changement
      ["s-name","s-desc","s-lang","s-entry","s-github-url","s-github-token"].forEach(id => {
        document.getElementById(id)?.addEventListener("input", markDirty);
        document.getElementById(id)?.addEventListener("change", markDirty);
      });
      document.getElementById("s-auto-update")?.addEventListener("change", markDirty);
      document.getElementById("s-auto-restart")?.addEventListener("change", markDirty);
    }

    function markDirty() { dirty = true; }

    function toggleTokenVisibility() {
      const input = document.getElementById("s-github-token");
      const btn = document.querySelector(".token-toggle");
      if (input.type === "password") { input.type = "text"; btn.textContent = "Masquer"; }
      else { input.type = "password"; btn.textContent = "Afficher"; }
    }

    // ── Sauvegarder les settings ───────────────────────────
    async function saveSettings() {
      const statusEl = document.getElementById("save-status");
      statusEl.textContent = "Sauvegarde...";
      statusEl.className = "save-status";

      const body = {};
      const name = document.getElementById("s-name")?.value.trim();
      const desc = document.getElementById("s-desc")?.value.trim();
      const lang = document.getElementById("s-lang")?.value;
      const entry = document.getElementById("s-entry")?.value;
      const githubURL = document.getElementById("s-github-url")?.value.trim();
      const githubToken = document.getElementById("s-github-token")?.value;
      const autoUpdate = document.getElementById("s-auto-update")?.checked;
      const autoRestart = document.getElementById("s-auto-restart")?.checked;

      if (name !== currentSettings.name) body.name = name;
      if (desc !== currentSettings.description) body.description = desc;
      if (lang !== currentSettings.language) body.language = lang;
      if (entry !== currentSettings.entrypoint) body.entrypoint = entry;
      if (githubURL !== currentSettings.github_url) body.github_url = githubURL;
      if (githubToken !== "") body.github_token = githubToken;
      if (autoUpdate !== currentSettings.auto_update) body.auto_update = autoUpdate;
      if (autoRestart !== currentSettings.auto_restart) body.auto_restart = autoRestart;

      if (Object.keys(body).length === 0) {
        statusEl.textContent = "Aucun changement";
        return;
      }

      try {
        await API.updateSettings(scriptId, body);
        currentSettings = { ...currentSettings, ...body };
        dirty = false;
        statusEl.textContent = "✓ Sauvegardé";
        statusEl.className = "save-status saved";
        setTimeout(() => { statusEl.textContent = ""; }, 2000);
        Utils.toast("Paramètres sauvegardés", "success");
      } catch (e) {
        statusEl.textContent = "✕ Erreur";
        statusEl.className = "save-status error";
        Utils.toast(e.message, "error");
      }
    }

    // ── Clone ──────────────────────────────────────────────
    async function doClone() {
      const url = document.getElementById("s-github-url")?.value.trim();
      const token = document.getElementById("s-github-token")?.value;
      if (!url) { Utils.toast("Renseigne l'URL du repository d'abord.", "warn"); return; }
      if (!confirm(`Cloner "${url}" ? Les fichiers existants seront remplacés.`)) return;

      Utils.toast("Clonage en cours...", "info");
      try {
        const res = await API.githubClone(scriptId, url, token);
        Utils.toast(res.message, "success");
        await load();
      } catch (e) {
        Utils.toast(e.message, "error");
      }
    }

    // ── Pull ───────────────────────────────────────────────
    async function doPull() {
      const btn = document.getElementById("btn-pull");
      const result = document.getElementById("pull-result");
      btn.disabled = true;
      btn.textContent = "↓ Pull...";
      result.style.display = "none";

      try {
        const res = await API.githubPull(scriptId);
        result.style.display = "block";
        if (res.changed) {
          result.className = "pull-result success";
          result.textContent = `✓ Mis à jour — commit ${res.last_commit_sha?.slice(0,12)}`;
        } else {
          result.className = "pull-result warn";
          result.textContent = `○ Déjà à jour — commit ${res.last_commit_sha?.slice(0,12)}`;
        }
        await load();
      } catch (e) {
        result.style.display = "block";
        result.className = "pull-result error";
        result.textContent = `✕ ${e.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = "↓ Pull manuel";
      }
    }

    // ── Helpers ────────────────────────────────────────────
    function escHtml(s) {
      return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function doLogout() {
      await API.logout();
      Utils.setLoggedOut();
      Utils.go("../../");
    }

    // Avertir si on quitte avec des changements non sauvegardés
    window.addEventListener("beforeunload", e => {
      if (dirty) { e.preventDefault(); e.returnValue = ""; }
    });

    load();
  </script>
</body>
</html>
